<!doctype html>
<!--
  Renders the real panel bundle with a fake `hass` and generated demo data, for the README screenshots.
  Nothing here comes from a real account: every number, id and name is made up.
  Usage: uv run python scripts/screenshots.py (serves the repo root and shoots each tab with headless Chrome).
  Query: ?tab=overview|history|invoices|contracts|settings&lang=sv|en&theme=dark|light
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--primary-background-color); font-family: Roboto, "Segoe UI", sans-serif; }
  body.dark { --primary-background-color: #111111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b; --divider-color: #2f2f2f; --primary-color: #03a9f4; color-scheme: dark; }
  body.light { --primary-background-color: #fafafa; --card-background-color: #ffffff; --primary-text-color: #212121;
    --secondary-text-color: #727272; --divider-color: #e0e0e0; --primary-color: #03a9f4; color-scheme: light; }
</style>
</head>
<body>
<script type="module">
const q = new URLSearchParams(location.search);
// fixed clock (?now=ISO to change it) so regenerated screenshots are identical; the panel reads the time too,
// so Date itself is pinned before the bundle loads
const FIXED = new Date(q.get("now") || "2026-10-05T12:00:00").getTime();
const RealDate = Date;
globalThis.Date = class extends RealDate {
  constructor(...a) { super(...(a.length ? a : [FIXED])); }
  static now() { return FIXED; }
};
const tab = q.get("tab") || "overview", lang = q.get("lang") || "en";
document.body.className = q.get("theme") || "dark";
localStorage.setItem("me_tab", tab);

// deterministic pseudo-random + the fixed clock above: every run produces the same pictures
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const iso = (d) => d.toISOString();
const day0 = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const now = new Date();
const spot = (h) => 0.35 + 0.5 * Math.max(0, Math.sin(((h - 6) / 24) * 2 * Math.PI)) + rnd() * 0.15;

// a house with solar: winter consumption, summer production
function dayValues(d) {
  // seasonal sun factor 0.1 (Dec) .. 1 (Jun), so autumn days still produce a little
  const m = d.getMonth(), sun = 0.1 + 0.9 * (0.5 + 0.5 * Math.cos(((m - 5.5) / 12) * 2 * Math.PI));
  const cons = Math.max(1, (1 - sun) * 42 + 6 + rnd() * 8), prod = Math.max(0, sun * 48 * (0.4 + rnd() * 0.7));
  const price = 0.6 + rnd() * 0.9;
  return { cons, prod, cost: cons * (price + 0.9), comp: prod * price * 0.8, costEL: cons * price, costELEXT: cons * 0.9 };
}
function daily(from, to) {
  const out = { consumption: [], cost: [], costEL: [], costELEXT: [], production: [], compensation: [] };
  const stop = to < now ? to : now;  // nothing after today
  for (let d = day0(from); d < stop; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
    const v = dayValues(d), t = iso(d);
    out.consumption.push([t, v.cons]); out.cost.push([t, v.cost]); out.costEL.push([t, v.costEL]); out.costELEXT.push([t, v.costELEXT]);
    out.production.push([t, v.prod]); out.compensation.push([t, v.comp]);
  }
  return out;
}
function series(res, start, end) {
  const s = new Date(start), e = new Date(end), c = { consumption: [], cost: [] }, p = { production: [], compensation: [] };
  if (res === "hour") {
    for (let t = s; t < e && t < now; t = new Date(t.getTime() + 36e5)) {
      const h = t.getHours(), sun = Math.max(0, Math.sin(((h - 6) / 14) * Math.PI));
      const cons = h >= 9 && h <= 16 ? 0.1 + rnd() * 0.3 : 0.6 + rnd() * 1.4, prod = sun * (2 + rnd() * 3);
      c.consumption.push([iso(t), cons]); c.cost.push([iso(t), cons * (spot(h) + 0.9)]);
      p.production.push([iso(t), prod]); p.compensation.push([iso(t), prod * spot(h) * 0.8]);
    }
  } else if (res === "day") {
    const v = daily(s, e);
    Object.assign(c, { consumption: v.consumption, cost: v.cost }); Object.assign(p, { production: v.production, compensation: v.compensation });
  } else {
    for (let m = 0; m < 12; m++) {
      const d = new Date(s.getFullYear(), m, 1);
      if (d > now) break;
      let cons = 0, prod = 0, cost = 0, comp = 0;
      for (let k = 0; k < 30; k++) { const v = dayValues(new Date(d.getFullYear(), m, k + 1)); cons += v.cons; prod += v.prod; cost += v.cost; comp += v.comp; }
      c.consumption.push([iso(d), cons]); c.cost.push([iso(d), cost]); p.production.push([iso(d), prod]); p.compensation.push([iso(d), comp]);
    }
  }
  return { CONSUMPTION: c, PRODUCTION: p };
}

function invoices() {
  const out = [];
  for (let k = 1; k <= 14; k++) {
    const ps = new Date(now.getFullYear(), now.getMonth() - k, 1), pe = new Date(ps.getFullYear(), ps.getMonth() + 1, 0);
    const due = new Date(pe.getFullYear(), pe.getMonth() + 1, 28), v = dayValues(ps);
    const kwh = Math.round(v.cons * 30), spotAmt = kwh * (0.5 + rnd() * 0.6);
    const lines = [
      { category: "grid_fixed", name: "Nätabonnemang", kwh: 0, amount: 395 },
      { category: "grid_transfer", name: "Elöverföring", kwh, amount: kwh * 0.24 },
      { category: "energy_tax", name: "Energiskatt", kwh, amount: kwh * 0.55 },
      { category: "spot_energy", name: "Elhandel kvartspris", kwh, amount: spotAmt },
      { category: "supply_fixed", name: "Fast avgift elhandel", kwh: 0, amount: 49 },
    ];
    const amount = Math.round(lines.reduce((a, l) => a + l.amount, 0));
    out.push({ invoice_id: `demo-c${k}`, kind: "consumption", issue_date: iso(new Date(pe.getTime() + 864e5 * 5)).slice(0, 10),
      due_date: iso(due).slice(0, 10), period_start: iso(ps).slice(0, 10), period_end: iso(pe).slice(0, 10), amount, amount_ex_vat: amount * 0.8,
      status: k === 1 ? "ACCOUNTED" : "PAID", closed: k > 1, kwh, fixed: 444, power_fee: 0, other: 0, utilities: ["ELNAT", "ELHANDEL"], lines });
    const pk = Math.round(v.prod * 30);
    if (pk > 20) {
      const pl = [{ category: "production_spot", name: "Ersättning producerad el", kwh: pk, amount: -pk * (0.5 + rnd() * 0.4) },
        { category: "production_grid", name: "Nätnytta", kwh: pk, amount: -pk * 0.05 }];
      const pa = Math.round(pl.reduce((a, l) => a + l.amount, 0));
      out.push({ invoice_id: `demo-p${k}`, kind: "production", issue_date: iso(new Date(pe.getTime() + 864e5 * 5)).slice(0, 10),
        due_date: iso(due).slice(0, 10), period_start: iso(ps).slice(0, 10), period_end: iso(pe).slice(0, 10), amount: pa, amount_ex_vat: pa,
        status: "PAID", closed: true, kwh: pk, fixed: 0, power_fee: 0, other: 0, utilities: ["ELPROD"], lines: pl });
    }
  }
  return out;
}

const POINT_C = "735999000000000001", POINT_P = "735999000000000002";
const data = {
  updated: iso(now), fuse: "20A", han: { [POINT_C]: "OPEN" }, unread: 0, overdue: 0, invoices: invoices(),
  CONSUMPTION: { point: POINT_C, daily: daily(new Date(now.getTime() - 31 * 864e5), now),
    peak: { peakPowerConsumption: 7.4, dateTime: iso(new Date(now.getTime() - 3 * 864e5)), meteringPointId: POINT_C } },
  PRODUCTION: { point: POINT_P, daily: daily(new Date(now.getTime() - 31 * 864e5), now) },
};
const contracts = [
  { utility: "Elnät", product: "Säkringsabonnemang", contract: "active", start: "2024-03-01", end: null, fuse: "20A", area: "VLS", yearly_kwh: 14200 },
  { utility: "Elhandel", product: "Kvartspris", contract: "active", start: "2024-03-01", end: null, fuse: null, area: "VLS", yearly_kwh: 14200 },
  { utility: "Elhandel produktion", product: "Ersättning", contract: "active", start: "2024-05-15", end: null, fuse: null, area: "VLS", yearly_kwh: -9800 },
  { utility: "Elhandel", product: "Fastpris 1 år", contract: "ended", start: "2023-03-01", end: "2024-02-29", fuse: null, area: "VLS", yearly_kwh: 15100 },
];

// a PowerHub on the same facility, so the live card and the PowerHub settings show too
const P = "powerhub_demo_";
const ent = (id, state, attrs = {}) => ({ entity_id: id, state: String(state), attributes: attrs, last_updated: iso(now) });
const states = {}, entities = {};
const add = (domain, key, state, attrs) => {
  const id = `${domain}.${P}${key}`;
  states[id] = ent(id, state, attrs);
  entities[id] = { entity_id: id, platform: "malarenergi_powerhub", device_id: "demo-hub", translation_key: key };
};
add("sensor", "power_import", 2.84, { unit_of_measurement: "kW" }); add("sensor", "power_export", 0, { unit_of_measurement: "kW" });
add("sensor", "current_l1", 7.2, { unit_of_measurement: "A" }); add("sensor", "current_l2", 3.1, { unit_of_measurement: "A" });
add("sensor", "current_l3", 11.6, { unit_of_measurement: "A" }); add("sensor", "meter_id", POINT_C);
add("sensor", "han_port_state", "ACTIVE"); add("sensor", "sw_version", "1.3.1"); add("sensor", "wifi_rssi", -61, { unit_of_measurement: "dBm" });
add("sensor", "latest_notification", "–");
add("select", "facility_type", "VILLA", { options: ["VILLA", "APARTMENT", "TOWNHOUSE", "CABIN", "OTHER"] });
add("select", "heating_type", "HEATING_PUMP", { options: ["DISTRICT_HEATING", "ELECTRIC", "HEATING_PUMP", "GAS", "OIL", "WOOD", "NONE"] });
add("number", "area", 140, { min: 1, max: 2000, step: 1, unit_of_measurement: "m²" }); add("number", "occupants", 3, { min: 1, max: 20, step: 1 });
add("switch", "has_solar", "on"); add("switch", "has_battery", "off");
add("select", "ev_type", "THREE_PHASE", { options: ["NONE", "ONE_PHASE", "THREE_PHASE"] });
add("select", "fuse_size", "A20", { options: ["A10", "A16", "A20", "A25", "A32", "A35", "A50", "A63"] });
add("number", "fuse_limit_set", 19, { min: 1, max: 63, step: 1, unit_of_measurement: "A" });
add("number", "power_limit_set", 13, { min: 0.1, max: 100, step: 0.1, unit_of_measurement: "kW" });
for (const [k, v] of [["notify_total_power", "on"], ["notify_phase_load", "on"], ["notify_control_enabled_exceeded_power", "off"],
  ["notify_control_disabled_exceeded_power", "on"], ["notify_control_enabled_exceeded_phase", "off"], ["notify_control_disabled_exceeded_phase", "on"]]) add("switch", k, v);
// the panel finds its data sensor by an `invoices` attribute and re-fetches when it changes
states["sensor.malarenergi_demo_latest_invoice"] = ent("sensor.malarenergi_demo_latest_invoice", 0, { invoices: [] });

const options = { language: lang, notify_targets: ["mobile_app_demo_phone"], notify_new_invoice: true, notify_overdue: true,
  notify_han_change: true, notify_auth: true, invoices_per_page: 6, show_powerhub: true };
const replies = {
  "malarenergi/data": () => ({ data, ok: true }),
  "malarenergi/contracts": () => contracts,
  "malarenergi/series": (m) => series(m.resolution, m.start, m.end),
  "malarenergi/settings/get": () => ({ options, notify_services: ["mobile_app_demo_phone", "mobile_app_demo_tablet"], languages: ["auto", "en", "sv", "nb", "da", "fi", "is"], powerhub: "configured" }),
  "malarenergi/settings/set": (m) => ({ options: Object.assign(options, m.options) }),
  "auth/sign_path": (m) => ({ path: m.path + "?authSig=demo" }),
};
const hass = {
  language: lang, locale: { language: lang }, states, entities, config: { components: ["malarenergi", "malarenergi_powerhub"] },
  connection: { sendMessagePromise: async (m) => { const f = replies[m.type]; if (!f) throw new Error("demo: " + m.type); return f(m); } },
  callService: async () => undefined,
};

await import("../../custom_components/malarenergi/www/panel.js");
const el = document.createElement("malarenergi-panel");
el.hass = hass; el.narrow = q.get("narrow") === "1";
document.body.append(el);
</script>
</body>
</html>
